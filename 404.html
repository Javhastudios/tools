<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Javhastudios Tools — Nueva ubicación</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #e8e8e4;
      --surface: #deded9;
      --accent: #0f6151;
      --accent-dim: rgba(15, 97, 81, 0.1);
      --text: #1a1a1a;
      --muted: #8a8a84;
      --border: rgba(15, 97, 81, 0.25);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    /* Ambient glow */
    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 300px;
      background: radial-gradient(ellipse, rgba(15, 97, 81, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    /* Waveform decoration */
    .waveform {
      display: flex;
      align-items: center;
      gap: 3px;
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.1s;
    }

    .waveform span {
      display: block;
      width: 3px;
      background: var(--accent);
      border-radius: 2px;
      animation: wave 1.4s ease-in-out infinite;
    }

    .waveform span:nth-child(1)  { height: 8px;  animation-delay: 0s; }
    .waveform span:nth-child(2)  { height: 18px; animation-delay: 0.1s; }
    .waveform span:nth-child(3)  { height: 28px; animation-delay: 0.2s; }
    .waveform span:nth-child(4)  { height: 14px; animation-delay: 0.3s; }
    .waveform span:nth-child(5)  { height: 36px; animation-delay: 0.4s; }
    .waveform span:nth-child(6)  { height: 22px; animation-delay: 0.5s; }
    .waveform span:nth-child(7)  { height: 42px; animation-delay: 0.6s; }
    .waveform span:nth-child(8)  { height: 28px; animation-delay: 0.5s; }
    .waveform span:nth-child(9)  { height: 36px; animation-delay: 0.4s; }
    .waveform span:nth-child(10) { height: 18px; animation-delay: 0.3s; }
    .waveform span:nth-child(11) { height: 28px; animation-delay: 0.2s; }
    .waveform span:nth-child(12) { height: 12px; animation-delay: 0.1s; }
    .waveform span:nth-child(13) { height: 6px;  animation-delay: 0s; }

    @keyframes wave {
      0%, 100% { transform: scaleY(1); opacity: 0.6; }
      50%       { transform: scaleY(0.4); opacity: 1; }
    }

    .label {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.2rem;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.3s;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(4rem, 12vw, 9rem);
      line-height: 0.9;
      letter-spacing: 0.02em;
      color: var(--text);
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.5s;
    }

    h1 span {
      color: var(--accent);
    }

    .divider {
      width: 60px;
      height: 1px;
      background: var(--border);
      margin: 2rem auto;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.7s;
    }

    .message {
      font-size: 1rem;
      font-weight: 300;
      color: var(--muted);
      line-height: 1.7;
      max-width: 420px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.9s;
    }

    .message strong {
      color: var(--text);
      font-weight: 500;
    }

    .cta {
      margin-top: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 1.1s;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.9rem 2.2rem;
      background: var(--accent);
      color: #ffffff;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.15);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
    }

    .btn:hover::before {
      transform: translateX(0);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(15, 97, 81, 0.3);
    }

    .btn svg {
      transition: transform 0.25s ease;
    }

    .btn:hover svg {
      transform: translateX(3px);
    }

    .footer-note {
      margin-top: 3rem;
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 1.3s;
    }

    .footer-note a {
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      transition: color 0.2s;
    }

    .footer-note a:hover {
      color: var(--accent);
    }

    /* Countdown */
    .countdown {
      margin-top: 0.8rem;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 1.4s;
    }

    #counter {
      color: var(--accent);
      font-weight: 500;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="waveform">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span>
  </div>

  <p class="label">Javha Studios · Tools</p>

  <h1>NOS<br>HEMOS<br><span>MUDADO</span></h1>

  <div class="divider"></div>

  <p class="message">
    Las herramientas de producción y mezcla ahora<br>
    están en <strong>javhastudios.com/tools</strong>
  </p>

  <div class="cta">
    <a class="btn" href="https://javhastudios.com/tools">
      IR A LAS TOOLS
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>

  <p class="countdown">Redirigiendo en <span id="counter">5</span> segundos...</p>

  <p class="footer-note">
    <a href="https://javhastudios.com">javhastudios.com</a>
    &nbsp;·&nbsp; Mezcla · Mastering · Cursos
  </p>

</div>

<script>
  let n = 10;
  const el = document.getElementById('counter');
  const timer = setInterval(() => {
    n--;
    el.textContent = n;
    if (n <= 0) {
      clearInterval(timer);
      window.location.href = 'https://javhastudios.com/tools';
    }
  }, 1000);
</script>

</body>
</html>
